<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track view, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f4f5; color: #18181b; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px; overflow: hidden">

<div style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; background: #fff; border-bottom: 1px solid #e4e4e7">
<div style="flex: 1; min-width: 0">
<div style="font-weight: 700; font-size: 16px; line-height: 20px; white-space: nowrap">Friday game</div>
<div style="font-size: 12px; line-height: 16px; color: #52525b; white-space: nowrap">Green · Long game</div>
</div>
<button type="button" aria-label="Undo" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
<button type="button" aria-label="Redo" aria-disabled="true" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #e4e4e7; border-radius: 8px; background: #fafafa; color: #a1a1aa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
<button type="button" aria-label="Edit mode" aria-pressed="false" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
<button type="button" aria-label="Menu" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</div>

<div style="flex: none; padding: 8px">
<div style="display: flex; gap: 2px; padding: 3px; background: #e4e4e7; border-radius: 10px">
<button type="button" aria-pressed="true" style="flex: 1; height: 44px; border: 0; border-radius: 7px; background: #fff; box-shadow: 0 1px 3px rgba(24,24,27,.2); color: #18181b; font-size: 14px; font-weight: 600">Track</button>
<button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 7px; background: transparent; color: #3f3f46; font-size: 14px; font-weight: 500">Ownership</button>
<button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 7px; background: transparent; color: #3f3f46; font-size: 14px; font-weight: 500">Scoreboard</button>
</div>
</div>

<div style="flex: none; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>
<span style="font-size: 14px; font-weight: 600">Top acts first</span>
<span style="flex: 1"></span>
<button type="button" role="switch" aria-checked="false" style="height: 44px; padding: 0 8px; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; font-size: 14px; font-weight: 500; color: #18181b"><span style="width: 36px; height: 20px; border-radius: 10px; background: #a1a1aa; position: relative; display: inline-block"><span style="position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 8px; background: #fff"></span></span>Full track</button>
</div>

<div style="flex: 1; min-height: 0; margin: 0 8px; display: flex; flex-direction: column; border: 1px solid #d4d4d8; border-radius: 12px; overflow: hidden; background: #fff">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
<div style="display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; height: {{r.h}}; flex: none; border-bottom: 1px solid #e4e4e7">
<div style="display: flex; align-items: center; justify-content: center; background: {{r.bg}}; font-family: 'IBM Plex Mono', monospace; font-weight: {{r.fw}}; font-size: {{r.fs}}; color: {{r.ink}}; border-right: 1px solid #d4d4d8">{{r.price}}</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 12px; min-width: 0">
<sc-for list="{{r.tokens}}" as="t" hint-placeholder-count="1">
<button type="button" aria-label="{{t.label}}" style="position: relative; flex: none; width: 76px; height: 44px; box-sizing: border-box; padding: 0; border: 1.5px solid rgba(24,24,27,.45); border-radius: 8px; background: {{t.color}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 700; box-shadow: {{t.ring}}">
<sc-if value="{{t.showRank}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -8px; left: -8px; width: 20px; height: 20px; border-radius: 10px; background: #18181b; color: #fff; font-size: 12px; line-height: 20px; text-align: center; border: 1.5px solid #fff">{{t.rank}}</span></sc-if>
<span style="font-size: 17px">{{t.abbr}}</span>
<span style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; background: {{t.ink}}; color: {{t.color}}; border: 1.5px solid rgba(24,24,27,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; line-height: 12px; font-weight: 700"><svg width="11" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.6 10H4.6z"/><rect x="4.5" y="19.5" width="15" height="2.2" rx="1"/></svg>{{t.pres}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: #52525b">{{r.zone}}</div>
</div>
</sc-for>
</div>

<div style="flex: none; height: 96px; box-sizing: border-box; margin-top: 8px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #fff; border-top: 1px solid #e4e4e7">
<div style="flex: none; width: 56px; height: 44px; box-sizing: border-box; border: 1.5px solid rgba(24,24,27,.45); border-radius: 8px; background: #9f3841; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">XP</div>
<div style="flex: 1; min-width: 0">
<div style="font-weight: 600; font-size: 15px; line-height: 20px; white-space: nowrap">Express at 110</div>
<div style="font-size: 12px; line-height: 16px; color: #52525b; white-space: nowrap">Acts 2nd · president H</div>
</div>
<button type="button" style="flex: none; height: 56px; width: 76px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid #d4d4d8; border-radius: 10px; background: #fff; color: #18181b; font-size: 16px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg><span style="font-family: 'IBM Plex Mono', monospace">120</span></button>
<button type="button" style="flex: none; height: 56px; width: 76px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid #d4d4d8; border-radius: 10px; background: #fff; color: #18181b; font-size: 16px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span style="font-family: 'IBM Plex Mono', monospace">100</span></button>
</div>

<div style="flex: none; height: 72px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px 8px; background: #fff">
<button type="button" style="flex: 3; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 8px; background: #047857; color: #fff; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Start company</button>
<button type="button" style="flex: 2; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>Merge</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const CO = {
union: { n: 'Union', a: 'U', c: '#e87d3c', i: '#18181b' },
express: { n: 'Express', a: 'XP', c: '#9f3841', i: '#ffffff' },
northernPort: { n: 'Northern Port', a: 'NP', c: '#385174', i: '#ffffff' },
tunneling: { n: 'Tunneling', a: 'TU', c: '#b6a998', i: '#18181b' },
agricultural: { n: 'Agricultural', a: 'AG', c: '#446e4c', i: '#ffffff' },
resourceful: { n: 'Resourceful', a: 'RE', c: '#f1e1b9', i: '#18181b' }
};
const Q = {
150: [['union', 'A']],
110: [['express', 'H']],
90: [['northernPort', 'Jo'], ['tunneling', 'Ja']],
70: [['agricultural', 'A']],
60: [['resourceful', 'H']]
};
const prices = [165, 150, 135, 120, 110, 100, 90, 80, 70, 60, 50];
const Z = (p) => (p >= 120 && p <= 135) ? ['#e9d5ff', 'Purple'] : (p >= 100 && p <= 110) ? ['#bbf7d0', 'Green'] : (p >= 60 && p <= 90) ? ['#fde68a', 'Yellow'] : ['#e4e4e7', ''];
const rows = prices.map((p) => {
const q = Q[p] || [];
const occ = q.length > 0;
return {
price: p,
bg: Z(p)[0],
zone: Z(p)[1],
h: occ ? '60px' : '30px',
fs: occ ? '20px' : '14px',
fw: occ ? 600 : 500,
ink: occ ? '#18181b' : '#52525b',
tokens: q.map((t, i) => ({
abbr: CO[t[0]].a,
color: CO[t[0]].c,
ink: CO[t[0]].i,
pres: t[1],
rank: i + 1,
showRank: q.length > 1,
label: CO[t[0]].n + ' at ' + p + ', president ' + t[1],
ring: t[0] === 'express' ? '0 0 0 2px #fff, 0 0 0 5px #18181b' : 'none'
}))
};
});
return { rows };
}
}
</script>
</body>
</html>
