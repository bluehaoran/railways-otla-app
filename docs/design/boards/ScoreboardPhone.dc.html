<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard view, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f4f5; color: #18181b; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px; overflow: hidden">

<div style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; background: #fff; border-bottom: 1px solid #e4e4e7">
<div style="flex: 1; min-width: 0">
<div style="font-weight: 700; font-size: 16px; line-height: 20px; white-space: nowrap">Friday game</div>
<div style="font-size: 12px; line-height: 16px; color: #52525b; white-space: nowrap">Green · Long game · 5 players</div>
</div>
<button type="button" aria-label="Undo" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
<button type="button" aria-label="Redo" aria-disabled="true" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #e4e4e7; border-radius: 8px; background: #fafafa; color: #a1a1aa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
<button type="button" aria-label="Edit mode" aria-pressed="false" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
<button type="button" aria-label="Menu" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</div>

<div style="flex: none; padding: 8px">
<div style="display: flex; gap: 2px; padding: 3px; background: #e4e4e7; border-radius: 10px">
<button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 7px; background: transparent; color: #3f3f46; font-size: 14px; font-weight: 500">Track</button>
<button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 7px; background: transparent; color: #3f3f46; font-size: 14px; font-weight: 500">Ownership</button>
<button type="button" aria-pressed="true" style="flex: 1; height: 44px; border: 0; border-radius: 7px; background: #fff; box-shadow: 0 1px 3px rgba(24,24,27,.2); color: #18181b; font-size: 14px; font-weight: 600">Scoreboard</button>
</div>
</div>

<div style="flex: none; margin: 0 8px 8px; border: 1px solid #d4d4d8; border-radius: 12px; background: #fff; overflow: hidden">
<sc-for list="{{ranked}}" as="p" hint-placeholder-count="5">
<div style="height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: 1px solid #f4f4f5; background: {{p.bg}}">
<span style="width: 18px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px">{{p.rank}}</span>
<span style="width: 26px; height: 26px; border-radius: 13px; background: #18181b; color: #fff; font-size: 12px; font-weight: 700; line-height: 26px; text-align: center">{{p.code}}</span>
<span style="flex: 1; font-size: 14px; font-weight: {{p.fw}}">{{p.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px">{{p.total}}</span>
</div>
</sc-for>
</div>

<div style="flex: none; margin: 0 8px; border: 1px solid #d4d4d8; border-radius: 12px; background: #fff; overflow: hidden">
<div style="display: grid; grid-template-columns: 84px repeat(5, minmax(0, 1fr)); height: 52px; align-items: center; background: #fafafa">
<div style="padding: 0 8px; font-size: 12px; font-weight: 600; color: #52525b">Value</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="5">
<div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{p.head}}">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #18181b; color: #fff; font-size: 12px; font-weight: 700; line-height: 28px; text-align: center">{{p.code}}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: 84px repeat(5, minmax(0, 1fr)); height: 56px; align-items: center; border-top: 1px solid #e4e4e7">
<div style="padding: 0 8px; font-weight: 600">Cash</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="5">
<div style="height: 100%; display: flex; align-items: center; justify-content: center; background: {{p.col}}">
<div style="width: 52px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; border: 1px solid #a1a1aa; border-radius: 8px; background: #fff; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px">{{p.cash}}</div>
</div>
</sc-for>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 84px repeat(5, minmax(0, 1fr)); height: 52px; align-items: center; border-top: 1px solid #e4e4e7">
<div style="padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
<span style="width: 34px; height: 22px; border-radius: 6px; background: {{r.color}}; color: {{r.ink}}; border: 1.5px solid rgba(24,24,27,.45); box-sizing: border-box; font-size: 12px; font-weight: 700; line-height: 19px; text-align: center">{{r.abbr}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 14px; color: #52525b">@{{r.price}}</span>
</div>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5">
<div style="height: 100%; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 0 6px; background: {{c.col}}">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; line-height: 20px; color: {{c.ink}}">{{c.value}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 14px; color: #52525b">{{c.sub}}</span>
</div>
</sc-for>
</div>
</sc-for>

<div style="display: grid; grid-template-columns: 84px repeat(5, minmax(0, 1fr)); height: 52px; align-items: center; border-top: 2px solid #18181b">
<div style="padding: 0 8px; font-weight: 700">Total</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="5">
<div style="height: 100%; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; background: {{p.col}}">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px">{{p.total}}</span>
</div>
</sc-for>
</div>
</div>

<div style="flex: 1"></div>

<div style="flex: none; height: 72px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px 8px; background: #fff; border-top: 1px solid #e4e4e7">
<button type="button" style="flex: 3; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 8px; background: #047857; color: #fff; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Start company</button>
<button type="button" style="flex: 2; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>Merge</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const PL = [
{ code: 'H', name: 'Haoran', cash: 142 },
{ code: 'A', name: 'Ari', cash: 85 },
{ code: 'Jo', name: 'John', cash: 210 },
{ code: 'Ja', name: 'James', cash: 70 },
{ code: 'M', name: 'Mei', cash: 120 }
];
const CO = [
{ a: 'U', c: '#e87d3c', i: '#18181b', price: 150, s: { H: 2, A: 2, Jo: 1, Ja: 1, M: 2 } },
{ a: 'XP', c: '#9f3841', i: '#ffffff', price: 110, s: { H: 2, A: 0, Jo: 1, Ja: 0, M: 1 } },
{ a: 'NP', c: '#385174', i: '#ffffff', price: 90, s: { H: 0, A: 1, Jo: 2, Ja: 1, M: 0 } },
{ a: 'TU', c: '#b6a998', i: '#18181b', price: 90, s: { H: 0, A: 0, Jo: 0, Ja: 2, M: 1 } },
{ a: 'AG', c: '#446e4c', i: '#ffffff', price: 70, s: { H: 1, A: 1, Jo: 0, Ja: 0, M: 2 } }
];
const total = {};
PL.forEach((p) => {
total[p.code] = p.cash + CO.reduce((sum, c) => sum + c.s[p.code] * c.price, 0);
});
const order = PL.map((p) => p.code).sort((a, b) => total[b] - total[a]);
const lead = order[0];
const LEAD = '#ecfdf5';
const players = PL.map((p) => ({
code: p.code, cash: p.cash, total: total[p.code],
head: p.code === lead ? LEAD : '#fafafa',
col: p.code === lead ? LEAD : '#ffffff'
}));
const rows = CO.map((c) => ({
abbr: c.a, color: c.c, ink: c.i, price: c.price,
cells: PL.map((p) => {
const n = c.s[p.code];
return {
value: n === 0 ? '–' : String(n * c.price),
sub: n === 0 ? '' : n + '×' + c.price,
ink: n === 0 ? '#71717a' : '#18181b',
col: p.code === lead ? LEAD : '#ffffff'
};
})
}));
const ranked = order.map((code, i) => ({
rank: i + 1,
code,
name: PL.filter((p) => p.code === code)[0].name,
total: total[code],
bg: i === 0 ? LEAD : '#ffffff',
fw: i === 0 ? 700 : 500
}));
return { players, rows, ranked };
}
}
</script>
</body>
</html>
