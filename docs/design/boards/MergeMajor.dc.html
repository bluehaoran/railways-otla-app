<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Merge wizard, step 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 600px; height: 700px; box-sizing: border-box; padding: 20px; background: #a1a1aa; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #18181b; overflow: hidden">
<div style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; border-radius: 16px; box-shadow: 0 12px 32px rgba(24,24,27,.35); overflow: hidden">

<div style="height: 64px; flex: none; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px 0 24px; border-bottom: 1px solid #e4e4e7">
<div style="flex: 1; font-size: 20px; font-weight: 700">Merge two minors into a major</div>
<button type="button" aria-label="Close" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #3f3f46"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 16px 24px">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 30px; height: 30px; border-radius: 15px; background: #047857; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span style="color: #3f3f46">Minors</span></div>
<div style="flex: 1; height: 2px; background: #047857"></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 30px; height: 30px; border-radius: 15px; background: #18181b; color: #fff; font-size: 14px; font-weight: 700; line-height: 30px; text-align: center">2</span><span style="font-weight: 700">Major</span></div>
<div style="flex: 1; height: 2px; background: #d4d4d8"></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #a1a1aa; color: #52525b; font-size: 14px; font-weight: 600; line-height: 26px; text-align: center">3</span><span style="color: #52525b">Preview</span></div>
</div>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 24px">
<div style="font-size: 14px; color: #3f3f46">Choose the major that replaces Tunneling and Agricultural. Where a major has two names, pick the one on your box.</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{majors}}" as="m" hint-placeholder-count="6">
<div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 8px; border: {{m.bd}}; border-radius: 12px; background: {{m.bg}}">
<button type="button" aria-pressed="{{m.on}}" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 6px; border: 0; background: transparent; color: #18181b; text-align: left">
<span style="flex: none; width: 48px; height: 34px; border-radius: 8px; background: {{m.color}}; color: {{m.ink}}; border: 1.5px solid rgba(24,24,27,.45); box-sizing: border-box; font-size: 17px; font-weight: 700; line-height: 31px; text-align: center">{{m.abbr}}</span>
<span style="flex: 1; font-size: 16px; font-weight: 600">{{m.name}}</span>
<sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
</button>
<sc-if value="{{m.toggle}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 2px; padding: 3px; background: #f4f4f5; border: 1px solid #d4d4d8; border-radius: 10px">
<sc-for list="{{m.names}}" as="n" hint-placeholder-count="2">
<button type="button" aria-pressed="{{n.on}}" style="flex: 1; height: 38px; border: 0; border-radius: 7px; background: {{n.bg}}; box-shadow: {{n.sh}}; color: {{n.ink}}; font-size: 14px; font-weight: {{n.fw}}">{{n.label}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{m.single}}" hint-placeholder-val="{{false}}"><div style="height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; color: #52525b">One name only</div></sc-if>
</div>
</sc-for>
</div>
</div>

<div style="height: 76px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 24px; border-top: 1px solid #e4e4e7">
<span style="flex: 1; font-size: 13px; color: #3f3f46">Federation (F)</span>
<button type="button" style="height: 48px; padding: 0 20px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b; font-size: 15px; font-weight: 600">Back</button>
<button type="button" style="height: 48px; padding: 0 24px; border: 0; border-radius: 8px; background: #047857; color: #fff; font-size: 15px; font-weight: 600">Next</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":700}}'>
class Component extends DCLogic {
renderVals() {
const M = [
['C', '#e2363c', '#000000', ['Consortium', 'Name TBD'], 0],
['U', '#e87d3c', '#18181b', ['Union', 'Name TBD'], 0],
['S', '#ecb545', '#18181b', ['System', 'Syndicate'], 0],
['I', '#9cc1cd', '#18181b', ['International', 'Inc.'], 1],
['F', '#7ab152', '#18181b', ['Federation'], 0],
['E', '#985994', '#ffffff', ['Experiment', 'Enterprise'], 0]
];
const majors = M.map((m) => {
const on = m[0] === 'F';
const toggle = m[3].length > 1;
return {
abbr: m[0], color: m[1], ink: m[2],
name: m[3][m[4]],
on,
toggle,
single: !toggle,
bd: on ? '2px solid #047857' : '1px solid #a1a1aa',
bg: on ? '#ecfdf5' : '#ffffff',
names: m[3].map((label, i) => ({
label,
on: i === m[4],
bg: i === m[4] ? '#ffffff' : 'transparent',
sh: i === m[4] ? '0 1px 3px rgba(24,24,27,.2)' : 'none',
ink: i === m[4] ? '#18181b' : '#52525b',
fw: i === m[4] ? 600 : 500
}))
};
});
return { majors };
}
}
</script>
</body>
</html>
