<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ownership, edit mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #f4f4f5; color: #18181b; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px; overflow: hidden">

<div style="height: 64px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #fff; border-bottom: 1px solid #e4e4e7">
<div style="width: 124px; flex: none">
<div style="font-weight: 700; font-size: 16px; line-height: 20px; white-space: nowrap">Friday game</div>
<div style="font-size: 12px; line-height: 16px; color: #52525b; white-space: nowrap">Green · Long game</div>
</div>
<div style="display: flex; gap: 2px; padding: 3px; background: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 10px">
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: #52525b; font-size: 14px; font-weight: 500">Track</button>
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 7px; background: #fff; box-shadow: 0 1px 3px rgba(24,24,27,.2); color: #18181b; font-size: 14px; font-weight: 600">Ownership<span style="display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px; border-radius: 10px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>1</span></button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: #52525b; font-size: 14px; font-weight: 500">Scoreboard</button>
</div>
<div style="flex: 1"></div>
<button type="button" style="height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; background: #047857; color: #fff; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Start company</button>
<button type="button" style="height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>Merge</button>
<button type="button" aria-label="Edit mode, on" aria-pressed="true" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #b45309; border-radius: 8px; background: #b45309; color: #fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
<button type="button" aria-label="Undo" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
<button type="button" aria-label="Redo" aria-disabled="true" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #e4e4e7; border-radius: 8px; background: #fafafa; color: #a1a1aa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
<button type="button" aria-label="Menu" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</div>

<div style="height: 44px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #b45309; color: #fff">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
<span style="font-weight: 700">Edit mode</span>
<span style="font-size: 14px">Any value is accepted. Rule warnings show but never block.</span>
<div style="flex: 1"></div>
<button type="button" style="height: 32px; padding: 0 14px; border: 1.5px solid #fff; border-radius: 8px; background: transparent; color: #fff; font-size: 14px; font-weight: 600">Done</button>
</div>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 0">

<div style="border: 1px solid #d4d4d8; border-radius: 12px; background: #fff; overflow: hidden">
<div style="display: grid; grid-template-columns: 164px repeat(4, minmax(0, 1fr)) 120px 120px 104px; align-items: center; height: 56px; background: #fafafa">
<div style="padding: 0 12px; font-size: 12px; font-weight: 600; color: #52525b">Company, president</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #18181b; color: #fff; font-size: 12px; font-weight: 700; line-height: 26px; text-align: center">{{p.code}}</span>
<span style="font-size: 12px; line-height: 14px; color: #52525b">{{p.name}}</span>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px dashed #52525b"></span>
<span style="font-size: 12px; line-height: 14px; color: #52525b">Treasury</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid #52525b"></span>
<span style="font-size: 12px; line-height: 14px; color: #52525b">Market</span>
</div>
<div style="text-align: center; font-size: 12px; font-weight: 600; color: #52525b">Check</div>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 164px repeat(4, minmax(0, 1fr)) 120px 120px 104px; height: 92px; border-top: 1px solid #e4e4e7; align-items: center; background: {{r.bg}}">
<div style="padding: 0 8px 0 12px; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="flex: none; width: 34px; height: 24px; border-radius: 6px; background: {{r.color}}; color: {{r.ink}}; border: 1.5px solid rgba(24,24,27,.45); box-sizing: border-box; font-size: 12px; font-weight: 700; line-height: 21px; text-align: center">{{r.abbr}}</span>
<span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
</div>
<div style="margin-top: 4px; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #a1a1aa; border-radius: 8px; background: #fff; font-size: 14px"><span style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; background: {{r.color}}; color: {{r.ink}}; border: 1.5px solid rgba(24,24,27,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; line-height: 12px; font-weight: 700"><svg width="11" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.6 10H4.6z"/><rect x="4.5" y="19.5" width="15" height="2.2" rx="1"/></svg>{{r.pres}}</span><span style="flex: 1"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
</div>
<sc-for list="{{r.cells}}" as="cell" hint-placeholder-count="6">
<div style="align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-left: 1px solid #f4f4f5">
<div style="display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; border: 1px solid #a1a1aa; border-radius: 8px; background: #fff; overflow: hidden">
<button type="button" aria-label="Decrease" style="width: 44px; height: 42px; border: 0; background: #fff; color: #18181b; font-size: 20px; line-height: 20px; font-weight: 500">−</button>
<span style="width: 28px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px">{{cell.n}}</span>
<button type="button" aria-label="Increase" style="width: 44px; height: 42px; border: 0; background: #fff; color: #18181b; font-size: 20px; line-height: 20px; font-weight: 500">+</button>
</div>
<sc-if value="{{cell.pres}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; font-size: 12px; font-weight: 600"><span style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; background: {{cell.bg}}; color: {{cell.ink}}; border: 1.5px solid rgba(24,24,27,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; line-height: 12px; font-weight: 700"><svg width="11" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.6 10H4.6z"/><rect x="4.5" y="19.5" width="15" height="2.2" rx="1"/></svg>{{cell.code}}</span>+2 card</span></sc-if>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 6px">
<sc-if value="{{r.ok}}" hint-placeholder-val="{{true}}"><div style="display: flex; align-items: center; gap: 4px; color: #047857; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span style="font-family: 'IBM Plex Mono', monospace">{{r.check}}</span></div></sc-if>
<sc-if value="{{r.warn}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 4px; color: #92400e; font-size: 12px; line-height: 16px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>A has 3, Ja 2</div>
<button type="button" style="height: 44px; width: 92px; padding: 0; border: 1px solid #b45309; border-radius: 8px; background: #fff; color: #92400e; font-size: 12px; line-height: 14px; font-weight: 700">Transfer presidency</button>
</sc-if>
</div>
</div>
</sc-for>
</div>

</div>

<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; border: 4px solid #b45309; pointer-events: none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
renderVals() {
const P = [{ code: 'H', name: 'Haoran' }, { code: 'A', name: 'Ari' }, { code: 'Jo', name: 'John' }, { code: 'Ja', name: 'James' }];
const CO = {
union: { n: 'Union', a: 'U', c: '#e87d3c', i: '#18181b' },
express: { n: 'Express', a: 'XP', c: '#9f3841', i: '#ffffff' },
northernPort: { n: 'Northern Port', a: 'NP', c: '#385174', i: '#ffffff' },
tunneling: { n: 'Tunneling', a: 'TU', c: '#b6a998', i: '#18181b' },
agricultural: { n: 'Agricultural', a: 'AG', c: '#446e4c', i: '#ffffff' },
resourceful: { n: 'Resourceful', a: 'RE', c: '#f1e1b9', i: '#18181b' }
};
const R = [
{ k: 'union', pres: 'A', h: { H: 2, A: 0, Jo: 1, Ja: 2 }, t: 1, m: 2, total: 10 },
{ k: 'express', pres: 'H', h: { H: 0, A: 1, Jo: 1, Ja: 0 }, t: 1, m: 0, total: 5 },
{ k: 'northernPort', pres: 'Jo', h: { H: 1, A: 0, Jo: 0, Ja: 1 }, t: 1, m: 0, total: 5 },
{ k: 'tunneling', pres: 'Ja', h: { H: 0, A: 3, Jo: 0, Ja: 0 }, t: 0, m: 0, total: 5, warn: true },
{ k: 'agricultural', pres: 'A', h: { H: 0, A: 0, Jo: 0, Ja: 1 }, t: 0, m: 2, total: 5 },
{ k: 'resourceful', pres: 'H', h: { H: 0, A: 1, Jo: 1, Ja: 0 }, t: 1, m: 0, total: 5 }
];
const rows = R.map((r) => {
const co = CO[r.k];
const cells = P.map((p) => ({ n: r.h[p.code], pres: r.pres === p.code, code: p.code, bg: co.c, ink: co.i }));
cells.push({ n: r.t, pres: false, code: '', bg: co.c, ink: co.i });
cells.push({ n: r.m, pres: false, code: '', bg: co.c, ink: co.i });
return {
abbr: co.a, name: co.n, color: co.c, ink: co.i, pres: r.pres, cells,
check: r.total + '/' + r.total,
ok: !r.warn,
warn: !!r.warn,
bg: r.warn ? '#fffbeb' : '#ffffff'
};
});
return { players: P, rows };
}
}
</script>
</body>
</html>
